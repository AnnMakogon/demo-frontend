<h1 class="custom-label">{{ title }}</h1>
<div class="form-container">
  <div class="container">
    <mat-form-field appearance="fill">
      <mat-label>Enter Name</mat-label>
      <input matInput type="text" placeholder="Enter Username" [(ngModel)]="thisUser.fio" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Enter Password</mat-label>
      <input matInput type="password" placeholder="Enter Password" [(ngModel)]="thisUser.passwordId" required>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="login()">Login</button>
    <button mat-raised-button (click)="registration()">Registration</button>
  </div>
</div>
