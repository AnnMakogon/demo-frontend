<h1.label mat-dialog-title>Put(Apdate) Email</h1.label>
<div mat-dialog-content style="display: online; padding: 0px; margin:auto">

  <mat-form-field>
    Minutes
    <mat-select placeholder="Minutes" [(ngModel)]="editingNl.date.minute">
      <mat-option *ngFor="let m of minutes" [value]="m">
        {{m}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    Hourse
    <mat-select placeholder="Hourse" [(ngModel)]="editingNl.date.hour">
      <mat-option *ngFor="let h of hours" [value]="h">
        {{h}}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <input matInput [matDatepicker]="picker" [(ngModel)]="selectedDate" placeholder="Выберите дату"
      (dateChange)="getDate($event)">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field classs="full-width-input">
    <input matInput type="text" placeholder="New Text of Email" [(ngModel)]="editingNl.text" required>
  </mat-form-field>
  <mat-form-field classs="full-width-input">
    <input matInput type="text" placeholder="New Subuject of Email" [(ngModel)]="editingNl.subject" required>
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-raised-button (click)="onNoClick()">Cancel</button>
  <button class="right-align" mat-raised-button color="primary" [mat-dialog-close]="editingNl">Update</button>
</div>
